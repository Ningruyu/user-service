[pytest]
# 测试发现规则
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试输出选项
addopts =
    -v
    --strict-markers
    --tb=short
    --junitxml=results.xml
    --cov=app
    --cov-report=xml:coverage.xml
    --cov-report=term-missing

# 标记注册
markers =
    slow: 标记运行较慢的测试
